<!-- pacman-voshastudios.svg -->
<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Wipe mask: mengungkapkan teks/dots gelap saat Pac-Man lewat -->
    <clipPath id="reveal">
      <rect id="wipe" x="0" y="0" width="0" height="260">
        <animate attributeName="width" from="0" to="1000" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <!-- Grid dot generator -->
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="4"/>
    </pattern>

    <!-- “Pixel look” text style (tanpa font eksternal) -->
    <style>
      .bg { fill:#ffffff }
      .dots-light { fill:#d9d9d9 }
      .dots-dark  { fill:#111111 }
      .txt-light  { fill:#d0d0d0; paint-order:stroke; stroke:#d0d0d0; stroke-width:2; }
      .txt-dark   { fill:#111111; paint-order:stroke; stroke:#111111; stroke-width:2; }
      .pixel-font { font-family: Consolas, 'Courier New', monospace; font-weight:700;
                    letter-spacing:3px; font-size:92px; }
      .sub        { font-family: Consolas, 'Courier New', monospace; font-size:14px; fill:#888 }
      .track      { fill:none; stroke:#eee; stroke-width:2 }
      .pacman     { fill:#f5d000 }
      .eye        { fill:#111111 }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1000" height="260" rx="20"/>

  <!-- Light dots (seluruh area) -->
  <rect x="40" y="160" width="920" height="22" class="dots-light" fill="url(#dots)"/>

  <!-- Dark dots: hanya muncul di area yang sudah “dimakan” (pakai clip) -->
  <g clip-path="url(#reveal)">
    <rect x="40" y="160" width="920" height="22" class="dots-dark" fill="url(#dots)"/>
  </g>

  <!-- Title light (bayangan abu) -->
  <text x="500" y="128" text-anchor="middle" class="pixel-font txt-light">VOSHASTUDIO'S</text>

  <!-- Title dark: terungkap oleh mask -->
  <g clip-path="url(#reveal)">
    <text x="500" y="128" text-anchor="middle" class="pixel-font txt-dark">VOSHASTUDIO'S</text>
  </g>

  <!-- Jalur lari Pac-Man -->
  <path id="run" class="track" d="M 40 171 H 960"/>

  <!-- Pac-Man (mulut membuka-menutup) -->
  <g>
    <!-- kepala -->
    <g>
      <circle id="pm-body" r="14" class="pacman"/>
      <!-- mulut (segitiga) -->
      <path id="pm-mouth" d="M 0 0 L 14 -6 L 14 6 Z" fill="#ffffff">
        <animate attributeName="d"
          values="M 0 0 L 14 -2 L 14 2 Z; M 0 0 L 14 -9 L 14 9 Z; M 0 0 L 14 -2 L 14 2 Z"
          dur="0.5s" repeatCount="indefinite"/>
      </path>
      <!-- mata -->
      <circle class="eye" cx="-4" cy="-6" r="2.2"/>
      <!-- gerak sepanjang jalur -->
      <animateMotion dur="6s" repeatCount="indefinite">
        <mpath xlink:href="#run"/>
      </animateMotion>
    </g>
  </g>

  <!-- Caption kecil -->
  <text x="500" y="212" text-anchor="middle" class="sub">
    Pac-Man reveals pixels · made for @Vosha
  </text>
</svg>
